<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics from Scratch</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#fcfcfb; --surface:#f0efec; --text:#0b0b0b; --text2:#52514e; --line:#dcdbd6; --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1a1a19; --surface:#2a2a28; --text:#fff; --text2:#c3c2b7; --line:#3a3a37; --accent:#3987e5; } }
  :root[data-theme="dark"] { --bg:#1a1a19; --surface:#2a2a28; --text:#fff; --text2:#c3c2b7; --line:#3a3a37; --accent:#3987e5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  nav { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; padding:10px 16px; }
  nav a, nav button { color:var(--text); text-decoration:none; font:inherit; font-size:0.95rem; background:none; border:0; cursor:pointer; padding:8px 4px; min-height:40px; }
  nav a.brand { font-weight:700; margin-right:auto; }
  nav a:hover, nav button:hover { color:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:20px 16px 80px; }
  a { color:var(--accent); }
  h1 { font-size:1.9rem; line-height:1.25; margin:0.6em 0 0.4em; }
  h2 { font-size:1.4rem; margin:1.8em 0 0.5em; padding-top:0.4em; border-top:1px solid var(--line); }
  h3 { font-size:1.15rem; margin:1.5em 0 0.4em; }
  blockquote { margin:1em 0; padding:8px 16px; border-left:4px solid var(--accent); background:var(--surface); border-radius:0 8px 8px 0; }
  blockquote p { margin:0.4em 0; }
  table { border-collapse:collapse; display:block; overflow-x:auto; max-width:100%; margin:1em 0; font-size:0.95rem; }
  th, td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  th { background:var(--surface); }
  code { background:var(--surface); padding:1px 5px; border-radius:4px; font-size:0.9em; }
  pre { background:var(--surface); padding:12px 14px; border-radius:8px; overflow-x:auto; }
  pre code { background:none; padding:0; }
  details { background:var(--surface); border-radius:8px; padding:8px 14px; margin:1em 0; }
  summary { cursor:pointer; font-weight:600; }
  hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
  img { max-width:100%; }
  #err { color:#c0392b; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="?doc=README.md">Statistics from Scratch</a>
  <a href="?doc=README.md">Course map</a>
  <a href="?doc=GLOSSARY.md">Glossary</a>
  <a href="?doc=ANIMATIONS.md">Animations</a>
  <a href="stages/06-hypothesis-testing/09-choosing-a-test/visuals/test-chooser.html">Which test?</a>
  <button id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
</nav>
<main id="page"><p>Loading...</p></main>
<script src="assets/vendor/marked.umd.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  let doc = params.get("doc") || "README.md";
  if (!/^[\w\-./]+\.md$/.test(doc) || doc.includes("..")) doc = "README.md";
  const base = new URL(doc, new URL(".", location.href));

  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.setAttribute("data-theme", t); } catch (e) {}
  document.getElementById("theme").addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = root.getAttribute("data-theme") || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  fetch(base)
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((md) => {
      md = md.replace(/^---\n[\s\S]*?\n---\n/, "");                 // drop cheat-sheet front matter
      const page = document.getElementById("page");
      page.innerHTML = marked.parse(md, { gfm: true });
      const h1 = page.querySelector("h1");
      document.title = (h1 ? h1.textContent + " | " : "") + "Statistics from Scratch";
      page.querySelectorAll("a[href]").forEach((a) => {
        const href = a.getAttribute("href");
        if (/^(https?:|mailto:|#)/.test(href)) return;
        const url = new URL(href, base);
        if (url.origin !== location.origin) return;
        const rel = url.pathname.replace(new URL(".", location.href).pathname, "");
        if (rel.endsWith(".md")) a.href = "?doc=" + rel + url.hash;
        else if (rel.endsWith("/") || rel === "") a.href = rel ? "?doc=" + rel + "README.md" : "?doc=README.md";
        else a.href = url.pathname + url.hash;
      });
      if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
    })
    .catch((e) => { document.getElementById("page").innerHTML = '<p id="err">Could not load ' + doc + " (" + e.message + "). <a href=\"?doc=README.md\">Back to the course map</a></p>"; });
})();
</script>
</body>
</html>
