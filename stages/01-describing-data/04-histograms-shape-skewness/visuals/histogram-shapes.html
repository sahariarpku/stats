<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histogram Shapes</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../../../assets/visuals.css">
<style>button[aria-pressed="true"] { background: var(--surface-2); border-color: var(--series-1); }</style>
</head>
<body>
<main class="viz">
  <div class="viz-head">
    <div>
      <h1>One dataset, many histograms</h1>
      <p class="hint">200 values, each between 0 and 100. Each bar counts how many values fall in its range. Pick a shape, then drag the bin-width slider. Watch where the mean and the median land.</p>
    </div>
    <button id="theme" type="button">Theme: auto</button>
  </div>

  <div class="controls" id="shapes" role="group" aria-label="Choose a shape">
    <button type="button" data-shape="symmetric" aria-pressed="true">Symmetric</button>
    <button type="button" data-shape="right" aria-pressed="false">Right-skewed</button>
    <button type="button" data-shape="left" aria-pressed="false">Left-skewed</button>
    <button type="button" data-shape="bimodal" aria-pressed="false">Bimodal</button>
  </div>

  <svg id="plot" viewBox="0 0 760 290" role="img" aria-label="Histogram of 200 values with the mean and median marked" style="margin-top:10px"></svg>

  <div class="legend">
    <span><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 14 L1 4 L13 4 Z" fill="var(--series-1)"/></svg>Mean</span>
    <span><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1 L13 7 L7 13 L1 7 Z" fill="var(--series-2)"/></svg>Median</span>
  </div>

  <div class="readout" aria-live="polite">
    <div class="card"><div class="label"><span class="mark" style="background:var(--series-1)"></span>Mean</div><div class="value" id="mean"></div></div>
    <div class="card"><div class="label"><span class="mark" style="background:var(--series-2)"></span>Median</div><div class="value" id="median"></div></div>
    <div class="card"><div class="label">Skewness g₁ (how lopsided)</div><div class="value" id="skew"></div></div>
    <div class="card"><div class="label">Bins (number of bars)</div><div class="value" id="bins"></div></div>
  </div>

  <p class="verdict" id="verdict" aria-live="polite"></p>
  <div class="controls col" id="sliders"></div>
</main>

<script src="../../../../assets/visuals.js"></script>
<script>
const rand = Viz.rng(11);
const clip = (v) => Math.round(Math.min(98, Math.max(2, v)) * 10) / 10;
const exp = () => -Math.log(1 - rand());
const right = Array.from({ length: 200 }, () => clip(10 + 17 * exp()));
const DATA = {
  symmetric: Array.from({ length: 200 }, () => clip(50 + 12 * Viz.randn(rand))),
  right,
  left: right.map((v) => clip(100 - v)),
  bimodal: Array.from({ length: 200 }, (_, i) => clip((i % 2 ? 72 : 28) + 7 * Viz.randn(rand))),
};

const X = Viz.scale(0, 100, 40, 730);
const BASE = 240;
const svg = document.getElementById("plot");
const barLayer = Viz.el("g", {}, svg);
Viz.axisBottom(svg, X, { y: BASE, from: 0, to: 100, step: 10 });
const meanLine = Viz.el("line", { y1: 36, y2: BASE, stroke: "var(--series-1)", "stroke-width": 2 }, svg);
const medianLine = Viz.el("line", { y1: 36, y2: BASE, stroke: "var(--series-2)", "stroke-width": 2, "stroke-dasharray": "5 4" }, svg);
const meanMark = Viz.el("path", { fill: "var(--series-1)" }, svg);
const medianMark = Viz.el("path", { fill: "var(--series-2)" }, svg);
const meanText = Viz.el("text", { class: "strong", "text-anchor": "middle", y: 12 }, svg);
const medianText = Viz.el("text", { class: "strong", "text-anchor": "middle", y: 278 }, svg);

let shape = "symmetric";
let width = 10;
const $ = (id) => document.getElementById(id);
const f1 = (v) => (Math.round(v * 10) / 10).toString();

function skewness(v) {
  const n = v.length, m = Viz.mean(v), s = Viz.sd(v);
  return (n / ((n - 1) * (n - 2))) * v.reduce((a, x) => a + ((x - m) / s) ** 3, 0);
}

const VERDICT = {
  symmetric: (m, md) => "Symmetric: the mean (" + f1(m) + ") and the median (" + f1(md) + ") almost coincide. Report the mean and standard deviation.",
  right: (m, md) => "Right-skewed: the long tail is on the right, so it pulls the mean (" + f1(m) + ") above the median (" + f1(md) + "). Report the median and IQR.",
  left: (m, md) => "Left-skewed: the long tail is on the left, so it pulls the mean (" + f1(m) + ") below the median (" + f1(md) + "). Report the median and IQR.",
  bimodal: (m, md) => "Two humps: the mean (" + f1(m) + ") and median (" + f1(md) + ") fall in the valley between the groups, where almost nobody is. A single summary hides the story. Set the bin width to 25 and watch the two humps blur into one.",
};

function render() {
  const v = DATA[shape];
  const k = Math.ceil(100 / width);
  const counts = new Array(k).fill(0);
  v.forEach((x) => { counts[Math.min(k - 1, Math.floor(x / width))]++; });
  const top = Math.max(...counts);
  const h = Viz.scale(0, top, 0, 190);

  barLayer.replaceChildren();
  counts.forEach((c, i) => {
    const x0 = X(i * width);
    const x1 = X(Math.min(100, (i + 1) * width));
    Viz.el("rect", { x: x0 + 0.5, y: BASE - h(c), width: Math.max(1, x1 - x0 - 1), height: h(c), fill: "var(--dot)", opacity: 0.75 }, barLayer);
  });
  Viz.el("text", { x: 36, y: BASE - h(top) - 4, "text-anchor": "end" }, barLayer).textContent = top;

  const mean = Viz.mean(v), median = Viz.median(v);
  meanLine.setAttribute("x1", X(mean)); meanLine.setAttribute("x2", X(mean));
  medianLine.setAttribute("x1", X(median)); medianLine.setAttribute("x2", X(median));
  meanMark.setAttribute("d", "M" + (X(mean) - 7) + " 20 L" + (X(mean) + 7) + " 20 L" + X(mean) + " 34 Z");
  medianMark.setAttribute("d", "M" + X(median) + " 252 L" + (X(median) + 7) + " 259 L" + X(median) + " 266 L" + (X(median) - 7) + " 259 Z");
  meanText.setAttribute("x", X(mean)); meanText.textContent = "mean " + f1(mean);
  medianText.setAttribute("x", X(median)); medianText.textContent = "median " + f1(median);

  $("mean").textContent = f1(mean);
  $("median").textContent = f1(median);
  $("skew").textContent = skewness(v).toFixed(2);
  $("bins").textContent = k;
  $("verdict").textContent = VERDICT[shape](mean, median);
}

document.querySelectorAll("#shapes button").forEach((b) => b.addEventListener("click", () => {
  shape = b.dataset.shape;
  document.querySelectorAll("#shapes button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
}));

Viz.slider($("sliders"), {
  label: "Bin width (how wide each bar is)", min: 2, max: 40, step: 1, value: width,
  format: (v) => v, onInput: (v) => { width = v; render(); },
});
Viz.themeToggle($("theme"));
Viz.tour([
  { target: "#plot", title: "What the bars mean", text: "There are **200 values**, each between 0 and 100. They are sorted into ranges 10 wide: 0 to 10, 10 to 20, and so on. Each **grey bar** shows **how many values** landed in its range. A taller bar means more values. The small number on the left is the count in the tallest bar (74)." },
  { target: "#plot", title: "Two kinds of middle", text: "The **blue triangle** marks the **mean** (the average). The **orange diamond** marks the **median** (the middle value). This shape is balanced, like a hill, so they sit almost together: **50.3** and **50.6**." },
  { target: "#plot", title: "Give it a long tail", text: "Let us press **Right-skewed** (the buttons above the chart). Most values are now low, with a long thin tail stretching to the right. The few big values in the tail drag the **mean up to 25.8**, while the **median stays at 22.5**.", action: { label: "Show Right-skewed", run: () => document.querySelector('#shapes button[data-shape="right"]').click() } },
  { target: ".readout", title: "One number for lopsidedness", text: "**Skewness** measures how lopsided the shape is. Near 0 means balanced. Here it is **2.12**: positive, because the tail points right. **Left-skewed** gives **−2.12**, because its tail points left." },
  { target: "#sliders", title: "How wide is each bar?", text: "This slider sets the width of each bar. Wide bars hide detail; very thin bars look jumpy. Let us try a width of **2**, which gives **50** thin bars. The same data now looks spikier.", action: { label: "Set the width to 2", run: () => { const r = document.querySelectorAll("#sliders input[type=range]")[0]; r.value = 2; r.dispatchEvent(new Event("input")); } } },
  { target: "#shapes", title: "Your turn", text: "Pick **Bimodal** (two humps, two groups), then set the bar width to **25**. The two humps blur into what looks like one lump in the middle. Lesson: always try a few widths before you trust a histogram." },
]);
render();
</script>
</body>
</html>
