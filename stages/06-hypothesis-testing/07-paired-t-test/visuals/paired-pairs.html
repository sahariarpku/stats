<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break the Pairs</title>
<link rel="stylesheet" href="../../../../assets/visuals.css">
</head>
<body>
<main class="viz">
  <div class="viz-head">
    <div>
      <h1>Break the pairs</h1>
      <p class="hint">Eight patients, blood pressure before (blue) and after (orange). Each line joins one patient's two readings. Scramble the pairing and see what the tests do.</p>
    </div>
    <button id="theme" type="button">Theme: auto</button>
  </div>

  <svg id="plot" viewBox="0 0 760 290" role="img" aria-label="Before and after readings joined by lines for each patient"></svg>

  <div class="legend">
    <span><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="var(--series-1)"/></svg>Before</span>
    <span><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" fill="var(--series-2)"/></svg>After</span>
    <span><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="0" y="6" width="14" height="2" fill="var(--text-muted)"/></svg>Pair (same patient)</span>
  </div>

  <div class="readout" aria-live="polite">
    <div class="card"><div class="label">Mean drop</div><div class="value" id="md"></div></div>
    <div class="card"><div class="label">SD of the differences</div><div class="value" id="sd"></div></div>
    <div class="card"><div class="label"><span class="mark" style="background:var(--series-1)"></span>Paired t (p)</div><div class="value" id="pt" style="font-size:1.25rem"></div></div>
    <div class="card"><div class="label">Independent Welch t (p)</div><div class="value" id="wt" style="font-size:1.25rem"></div></div>
  </div>
  <p class="verdict" id="verdict" aria-live="polite"></p>

  <div class="controls">
    <button id="scramble" type="button">Scramble the pairs</button>
    <button id="restore" type="button">Restore the true pairs</button>
  </div>
</main>

<script src="../../../../assets/visuals.js"></script>
<script>
const BEFORE = [142, 138, 155, 129, 147, 161, 133, 145];
const AFTER = [135, 134, 148, 126, 139, 152, 130, 137];
let order = AFTER.map((_, i) => i);
const svg = document.getElementById("plot");
const $ = (id) => document.getElementById(id);
const Y = Viz.scale(120, 170, 255, 25);
const layer = Viz.el("g", {}, svg);
const tp = (t, df) => 2 * (1 - Viz.tCdf(Math.abs(t), df));
const f2 = (v) => (Math.round(v * 100) / 100).toString();
const pf = (p) => (p < 0.0001 ? "< 0.0001" : p.toFixed(4));

function render() {
  const after = order.map((i) => AFTER[i]);
  const n = BEFORE.length;
  const diffs = BEFORE.map((b, i) => b - after[i]);
  const dbar = Viz.mean(diffs), sd = Viz.sd(diffs), se = sd / Math.sqrt(n);
  const t = dbar / se, p = tp(t, n - 1);
  const v1 = Viz.sd(BEFORE) ** 2 / n, v2 = Viz.sd(after) ** 2 / n;
  const tw = (Viz.mean(BEFORE) - Viz.mean(after)) / Math.sqrt(v1 + v2);
  const dfw = (v1 + v2) ** 2 / (v1 ** 2 / (n - 1) + v2 ** 2 / (n - 1));
  const pw = tp(tw, dfw);

  layer.replaceChildren();
  const x1 = 220, x2 = 540;
  [120, 130, 140, 150, 160, 170].forEach((v) => {
    Viz.el("line", { x1: 60, x2: 700, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1, opacity: 0.6 }, layer);
    Viz.el("text", { x: 50, y: Y(v) + 4, "text-anchor": "end" }, layer).textContent = v;
  });
  Viz.el("text", { x: x1, y: 276, "text-anchor": "middle", class: "strong" }, layer).textContent = "Before";
  Viz.el("text", { x: x2, y: 276, "text-anchor": "middle", class: "strong" }, layer).textContent = "After";
  BEFORE.forEach((b, i) => {
    const a = after[i];
    Viz.el("line", { x1: x1, x2: x2, y1: Y(b), y2: Y(a), stroke: "var(--text-muted)", "stroke-width": 1.5, opacity: 0.85 }, layer);
  });
  BEFORE.forEach((b) => Viz.el("circle", { cx: x1, cy: Y(b), r: 6.5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }, layer));
  after.forEach((a) => Viz.el("rect", { x: x2 - 6, y: Y(a) - 6, width: 12, height: 12, fill: "var(--series-2)", stroke: "var(--surface-1)", "stroke-width": 2 }, layer));
  Viz.el("text", { x: 600, y: 22, class: "strong" }, layer).textContent = "differences:";
  diffs.forEach((d, i) => Viz.el("text", { x: 600 + (i % 4) * 36, y: 42 + Math.floor(i / 4) * 18 }, layer).textContent = d);

  $("md").textContent = f2(dbar);
  $("sd").textContent = f2(sd);
  $("pt").textContent = "t = " + f2(t) + " (p " + (p < 0.0001 ? "< 0.0001" : "= " + pf(p)) + ")";
  $("wt").textContent = "t = " + f2(tw) + " (p = " + pf(pw) + ")";
  const intact = order.every((v, i) => v === i);
  $("verdict").textContent = intact
    ? "With the true pairs, the lines are nearly parallel: every patient dropped by about the same amount. The differences vary only a little (SD " + f2(sd) + "), so the paired test is very sensitive. The independent test ignores the lines and sees only two overlapping clouds."
    : "After scrambling, the lines cross: each 'after' is now matched with the wrong patient. The mean drop is unchanged (" + f2(dbar) + "), and so is the Welch test, but the differences are far more variable (SD " + f2(sd) + "), so the paired test loses its power. The pairing was the information.";
}

$("scramble").addEventListener("click", () => {
  const o = [...order];
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
  order = o; render();
});
$("restore").addEventListener("click", () => { order = AFTER.map((_, i) => i); render(); });
Viz.themeToggle($("theme"));
render();
</script>
</body>
</html>
